name: Community acceptance
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  end-to-end:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Install browser and system libraries
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run database, search recovery, and browser acceptance
        run: python scripts/verify.py
      - name: Collect service logs on failure
        if: failure()
        run: docker compose -p rednote-test logs --tail=100
