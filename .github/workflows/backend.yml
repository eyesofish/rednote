name: Backend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  business:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: local-root
          MYSQL_DATABASE: rednote_test
          MYSQL_USER: rednote
          MYSQL_PASSWORD: rednote
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysql -urednote -prednote -Drednote_test -e 'SELECT 1'"
          --health-interval=3s --health-timeout=3s --health-retries=40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Verify the business API and search contracts
        working-directory: backend
        env:
          TEST_DATABASE_URL: mysql+pymysql://rednote:rednote@127.0.0.1:3306/rednote_test?charset=utf8mb4
        run: python -m pytest -q tests --ignore=tests/integration
